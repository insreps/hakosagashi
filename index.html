<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HakoSagashi｜練習場所を探す手間と、予約前の不安をなくす。</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F766E'/%3E%3Cpath d='M9 8.5h3.2v6h7.6v-6H23v15h-3.2v-6.2h-7.6v6.2H9v-15z' fill='%23FFFFFF'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="公共施設と民間レンタルスペースを横断し、鏡・床材・防音性能・ピアノ・広さ・利用条件など部屋単位の情報から最適な練習場所を検索できるサービスです。"
    />
    <meta
      property="og:title"
      content="HakoSagashi｜公共施設・レンタルスペースの部屋単位検索"
    />
    <meta
      property="og:description"
      content="ダンス・バンド・吹奏楽・演劇・ヨガなどの練習場所を、部屋ごとの設備・料金・予約ルールから横断検索。"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-100 selection:text-teal-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var isRawSource = !!document.querySelector('script[src*="/src/main.tsx"]');
        if (!isRawSource) return;
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="max-width:640px;margin:48px auto;padding:24px;font-family:system-ui,sans-serif;background:#fff;border:1px solid #cbd5e1;border-radius:12px;color:#0f172a;line-height:1.7">' +
            '<h1 style="font-size:18px;font-weight:700;margin:0 0 12px">GitHub Pages の公開フォルダ設定を確認してください</h1>' +
            '<p style="font-size:14px;color:#334155;margin:0 0 12px">現在はビルド前のソース用 <code>index.html</code>（<code>/src/main.tsx</code>）が配信されているため、画面を起動できていません。</p>' +
            '<ul style="font-size:14px;color:#334155;padding-left:20px;margin:0 0 16px">' +
            '<li><strong>手動アップロードの場合：</strong>GitHub の <strong>Settings → Pages</strong> で Branch を <code>main</code>、Folder を <strong><code>/docs</code></strong> に変更して保存してください。</li>' +
            '<li><strong>自動ビルドの場合：</strong><strong>Settings → Pages</strong> で Source を <strong>GitHub Actions</strong> に変更してください。</li>' +
            '</ul>' +
            '<div id="docs-jump"></div>' +
            '</div>';
          fetch('./docs/index.html', { method: 'HEAD' })
            .then(function (res) {
              if (res.ok) {
                var el = document.getElementById('docs-jump');
                if (el) {
                  el.innerHTML =
                    '<a href="./docs/" style="display:inline-block;padding:10px 16px;background:#0f766e;color:#fff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:600">ビルド済みサイト（./docs/）を開く</a>';
                }
              }
            })
            .catch(function () {});
        }, 1800);
      })();
    </script>
  </body>
</html>
